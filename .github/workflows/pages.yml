name: Sito

# Sito pubblico su GitHub Pages: pagina iniziale (site/) e manuale (docs/manuale) a ogni push su main
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/manuale/**', 'docs/scorciatoie.html', 'scripts/build-site.mjs', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Solo le librerie JavaScript: senza gli script di installazione (non serve scaricare Electron)
      - run: npm ci --ignore-scripts
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
